<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模块2 · AI智能决策中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100vh; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background:
      linear-gradient(180deg, #eaf5ec 0%, #d6ecda 60%, #c4e2cb 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .farm-bg {
    position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
    background: linear-gradient(to top, rgba(120,180,90,0.25), transparent);
    pointer-events: none; z-index: 0;
  }

  .card {
    position: relative; z-index: 1;
    width: 220px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 4px 18px rgba(34, 102, 51, 0.12);
    border: 1px solid rgba(120, 200, 140, 0.25);
  }

  /* 标题 + 状态点 */
  .title-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: #1a5c2b;
    margin-bottom: 4px;
  }
  .title-row .icon {
    width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(135deg, #43a047, #66bb6a);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 800;
  }
  .status {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: #5a8a6a; margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px dashed rgba(45, 122, 63, 0.2);
  }
  .status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: #43a047; box-shadow: 0 0 6px #43a047;
  }

  /* 按钮 */
  .btn {
    display: block; width: 100%;
    padding: 9px 0; border-radius: 20px;
    text-align: center; text-decoration: none;
    font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #2e7d32, #43a047, #66bb6a);
    box-shadow: 0 3px 10px rgba(46, 125, 50, 0.3);
    transition: all .2s;
    margin-bottom: 12px;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(46, 125, 50, 0.45);
  }
  .btn .arrow { margin-left: 4px; }

  /* 推荐追问 */
  .section-label {
    font-size: 11px; color: #4a7a5a; font-weight: 600;
    margin-bottom: 6px;
  }
  .qa-list { margin-bottom: 10px; }
  .qa {
    display: flex; align-items: flex-start; gap: 5px;
    padding: 5px 0;
    font-size: 11px; color: #2d5a3a;
    border-bottom: 1px dashed rgba(45, 122, 63, 0.12);
    line-height: 1.4;
  }
  .qa:last-child { border-bottom: none; }
  .qa .qmark {
    flex-shrink: 0;
    width: 12px; height: 12px; border-radius: 3px;
    background: #43a047; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800;
  }

  /* 标签 */
  .tags {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding-top: 8px;
    border-top: 1px dashed rgba(45, 122, 63, 0.2);
  }
  .tags span {
    font-size: 10px; padding: 2px 7px;
    border-radius: 10px;
  }
  .tag-1 { background: #e3f4e3; color: #2d7a3f; }
  .tag-2 { background: #d8eef5; color: #1a6e8a; }
  .tag-3 { background: #fdebd5; color: #b9620a; }
  .tag-4 { background: #ebe3f4; color: #6b3aa0; }
</style>
</head>
<body>

<div class="farm-bg"></div>

<div class="card">
  <div class="title-row">
    <span class="icon">AI</span>
    <span>AI 决策助手</span>
  </div>
  <div class="status">Smartbi AIChat · 已就绪</div>

  <a class="btn" href="https://tiaozhanbei.cloud.smartbi.com.cn/smartbi/vision/aichat/proxy/#/canvas/chat" target="_blank">
    进入 AI 智能问答<span class="arrow">→</span>
  </a>

  <div class="section-label">推荐追问</div>
  <div class="qa-list">
    <div class="qa"><span class="qmark">?</span><span>三门峡市风险来源是什么？</span></div>
    <div class="qa"><span class="qmark">?</span><span>生成高风险地市智能处方</span></div>
    <div class="qa"><span class="qmark">?</span><span>流通风险突出时如何应对？</span></div>
  </div>

  <div class="tags">
    <span class="tag-1">品种风险</span>
    <span class="tag-2">风险解读</span>
    <span class="tag-3">区域风险</span>
    <span class="tag-4">决策处方</span>
  </div>
</div>

</body>
</html>
