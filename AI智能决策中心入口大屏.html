<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智能决策中心 · 区域农产品滞销风险预警</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background:
      linear-gradient(180deg, #f6fdf6 0%, #e8f5e9 40%, #d8edd9 100%);
    color: #1a4d2e;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 底部农田风景装饰层 */
  .farm-bg {
    position: absolute; bottom: 0; left: 0; right: 0; height: 45vh;
    background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80') center bottom / cover no-repeat;
    mask-image: linear-gradient(to top, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
    opacity: 0.85; pointer-events: none; z-index: 0;
  }

  .content { position: relative; z-index: 1; text-align: center; }

  /* 标题 */
  .title {
    font-size: 44px; font-weight: 800; letter-spacing: 6px;
    color: #1a5c2b;
    text-shadow: 0 2px 10px rgba(26, 92, 43, 0.12);
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 16px; color: #5a8a6a; letter-spacing: 3px;
    margin-bottom: 60px;
  }

  /* 主按钮 */
  .enter-btn {
    display: inline-block;
    padding: 22px 72px; border-radius: 60px;
    font-size: 26px; font-weight: 700; letter-spacing: 4px;
    color: #fff; text-decoration: none;
    background: linear-gradient(135deg, #2e7d32, #43a047, #66bb6a);
    box-shadow:
      0 6px 24px rgba(46, 125, 50, 0.35),
      0 0 0 4px rgba(46, 125, 50, 0.1),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: all .3s ease;
    position: relative; overflow: hidden;
  }
  .enter-btn:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow:
      0 12px 36px rgba(46, 125, 50, 0.45),
      0 0 0 6px rgba(46, 125, 50, 0.15);
  }
  .enter-btn .arrow { display: inline-block; margin-left: 12px; }

  /* 底部标签 */
  .hint {
    margin-top: 20px; font-size: 13px; color: #6b9e7b; letter-spacing: 1px;
  }

  /* 右下角数据角标 */
  .corner-stats {
    position: absolute; bottom: 24px; right: 32px; z-index: 1;
    display: flex; gap: 18px; font-size: 12px; color: #4a7a5a;
  }
  .corner-stats span { opacity: 0.75; }

  /* 左上角标签 */
  .tag {
    position: absolute; top: 28px; left: 32px; z-index: 1;
    font-size: 12px; color: #5a8a6a; letter-spacing: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .tag::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #43a047; box-shadow: 0 0 8px #43a047;
  }
</style>
</head>
<body>

<div class="farm-bg"></div>

<div class="tag">Smartbi AIChat · 已就绪</div>

<div class="content">
  <h1 class="title">AI 智能决策中心</h1>
  <p class="subtitle">区域农产品滞销风险预警 · 自然语言驱动数据洞察</p>

  <a class="enter-btn" href="https://tiaozhanbei.cloud.smartbi.com.cn/smartbi/vision/aichat/proxy/#/canvas/chat" target="_blank">
    进入 AI 智能问答 <span class="arrow">➜</span>
  </a>

  <p class="hint">支持自然语言问数 · 多轮追问 · 归因分析</p>
</div>

<div class="corner-stats">
  <span>9 市</span><span>11 品种</span><span>7 维风险模型</span>
</div>

</body>
</html>
