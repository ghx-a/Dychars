        function switchChart(key) {
            document.querySelectorAll('.chart-div').forEach(function(div) {
                div.classList.remove('active');
            });
            var activeDiv = document.getElementById('chart-' + key);
            activeDiv.classList.add('active');
            setTimeout(function() {
                Plotly.Plots.resize(activeDiv);
            }, 0);
        }

        
        Object.keys(chartData).forEach(function(key) {
            var div = document.getElementById('chart-' + key);
            Object.assign(chartData[key].layout, {autosize: true});
            chartData[key].layout.yaxis = chartData[key].layout.yaxis || {};
            chartData[key].layout.yaxis.type = 'log';
            Plotly.newPlot(div, chartData[key].data, chartData[key].layout, {displayModeBar: false, responsive: true});
        });
        
        var firstKey = document.getElementById('citySelector').value;
        switchChart(firstKey);
        
        window.addEventListener('resize', function() {

            Object.keys(chartData).forEach(function(key) {
