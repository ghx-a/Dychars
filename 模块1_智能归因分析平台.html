<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模块1 · 智能归因分析平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100vh; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background:
      linear-gradient(180deg, #eaf5ec 0%, #d6ecda 60%, #c4e2cb 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* 底部农田背景 */
  .farm-bg {
    position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
    background: linear-gradient(to top, rgba(120,180,90,0.25), transparent);
    pointer-events: none; z-index: 0;
  }

  .card {
    position: relative; z-index: 1;
    width: 220px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 4px 18px rgba(34, 102, 51, 0.12);
    border: 1px solid rgba(120, 200, 140, 0.25);
  }

  /* 顶部状态行 */
  .head {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: #2d7a3f; font-weight: 600;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px dashed rgba(45, 122, 63, 0.2);
  }
  .head::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: #43a047; box-shadow: 0 0 6px #43a047;
  }

  /* 数据行 */
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; font-size: 12px;
  }
  .row .label { color: #4a7a5a; }
  .row .val { font-weight: 700; color: #1a5c2b; }
  .row .val.orange { color: #e67e22; }
  .row .val.red { color: #d9482b; }

  /* TOP3 标签 */
  .top3 {
    display: flex; flex-wrap: wrap; gap: 3px;
    margin: 6px 0 4px 0;
    max-width: 100%;
  }
  .top3 span {
    font-size: 10px; padding: 2px 6px;
    background: #fdecd5; color: #c66a1d;
    border-radius: 8px;
  }

  /* 模型短板 */
  .short {
    font-size: 10.5px; color: #b88216;
    background: #fff7e0; padding: 5px 7px;
    border-radius: 6px; margin: 6px 0 10px 0;
    line-height: 1.4;
  }

  /* 按钮 */
  .btn {
    display: block; width: 100%;
    padding: 9px 0; border-radius: 20px;
    text-align: center; text-decoration: none;
    font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #2e7d32, #43a047, #66bb6a);
    box-shadow: 0 3px 10px rgba(46, 125, 50, 0.3);
    transition: all .2s;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(46, 125, 50, 0.45);
  }
  .btn .arrow { margin-left: 4px; }
</style>
</head>
<body>

<div class="farm-bg"></div>

<div class="card">
  <div class="head">风险研判总览</div>

  <div class="row"><span class="label">整体判别</span><span class="val orange">中风险</span></div>
  <div class="row"><span class="label">最高风险地市</span><span class="val">三门峡市</span></div>
  <div class="row"><span class="label">综合风险分</span><span class="val red">6.6933</span></div>

  <div class="row"><span class="label">TOP3驱动因子</span></div>
  <div class="top3">
    <span>天气风险</span>
    <span>价格风险</span>
    <span>供给风险</span>
  </div>

  <div class="row"><span class="label">模型风险短板</span></div>
  <div class="short">数据不足·价格数据不足·消费数据不足</div>

  <a class="btn" href="http://39.96.80.229:8501/" target="_blank">
    查看完整归因<span class="arrow">→</span>
  </a>
</div>

</body>
</html>
